# =============================================================================
# MAS4RE — Docker Compose
#
# Uso:
#   docker compose up app                  → só testes unitários
#   docker compose --profile local up      → app + ollama local
#   docker compose run app pytest tests/   → rodar testes específicos
# =============================================================================

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mas4re-app
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      # Datasets montados como read-only (não versionados no git)
      - ./datasets/data:/app/datasets/data:ro
      # Resultados dos experimentos persistidos no host
      - ./experiments/results:/app/experiments/results
      - ./experiments/logs:/app/experiments/logs
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    networks:
      - mas4re-net

  ollama:
    image: ollama/ollama:latest
    container_name: mas4re-ollama
    profiles: ["local"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mas4re-net
    deploy:
      resources:
        reservations:
          memory: 8G

  # ── Inicializador de modelos (puxa modelos automaticamente) ────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: mas4re-ollama-init
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Puxando modelos para experimentos..."
        ollama pull qwen2.5:7b
        ollama pull llama3.1:8b
        ollama pull phi3.5:3.8b
        echo "Modelos prontos."
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - mas4re-net

volumes:
  ollama-models:
    name: mas4re-ollama-models

networks:
  mas4re-net:
    name: mas4re-network