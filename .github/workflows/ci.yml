# =============================================================================
# MAS4RE — CI Pipeline
# Roda lint + typecheck + testes unitários em cada push/PR
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install ".[dev]"

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format
        run: ruff format --check .

      - name: Mypy — typecheck
        run: mypy agents config domain evaluation llm prompts pipeline --ignore-missing-imports

  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install ".[dev]"

      - name: Pytest — testes unitários
        run: pytest tests/unit -v --tb=short --cov=agents --cov=domain --cov=evaluation --cov-report=term-missing

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security:
    name: Segurança — Segredos & Dependências
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — scan de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install .

      - name: pip-audit — vulnerabilidades de dependências
        run: pipx run pip-audit --strict --desc

  docker:
    name: Docker — Lint & Scan de Imagem
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — lint do Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mas4re-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan de vulnerabilidades da imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mas4re-app:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
